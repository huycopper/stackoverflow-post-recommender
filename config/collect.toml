# Settings for `python -m so_recommender.collect`. Paths are relative to the repo root.
# See docs/03_data_source.md for the collection strategy.

[api]
base_url = "https://api.stackexchange.com/2.3"
site = "stackoverflow"
key_env = "STACKEXCHANGE_KEY"   # read from the environment or .env
pagesize = 100                  # API maximum
request_delay_seconds = 1.0     # pause between requests, on top of any `backoff` the API asks for
timeout_seconds = 60
max_retries = 5
min_quota_remaining = 50        # stop before the daily quota runs out

[sample]
tags = ["python"]
# 1. Seed: top-voted questions per tag. Many are canonical originals with many duplicates.
# 10 pages (1,000 seeds) took ~2,200 requests and gave ~10k questions (24/10/2026). Raised to 100
# on 25/10 to collect as much as possible; the daily scheduled run continues until done.
seed_pages_per_tag = 100
seed_sort = "votes"
# 2. Linked: questions that link to the seeds; the ones closed as duplicates give labelled pairs.
# Seeds have hundreds of linked questions each: 100 seeds per request timed out, so keep it small.
linked_batch_size = 10
linked_pages_per_batch = 3
# 3. Background: ordinary questions of the tag, used as non-relevant candidates.
background_pages_per_tag = 1
background_sort = "activity"
# 4. Originals referenced by duplicates but not fetched yet (repeated for duplicate chains).
original_rounds = 3
# 5. Answers and comments. Parent ids are grouped so a batch holds about items_per_batch
#    children (by answer_count / comment_count) and every page is fetched; the page limit
#    is only a safety net (hits are logged in state.truncated_ids).
items_per_batch = 500
max_pages_per_batch = 50
# 6. Tag synonyms: the whole synonym table of the site (about 5,300 rows, 54 requests), to map
#    any spelling of a tag to its main tag (to_tag). Resumes after the last page fetched.
tag_synonym_pages = 100

[paths]
raw_dir = "data/raw"
state_file = "data/collect_state.json"
